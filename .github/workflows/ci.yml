name: Nutrition and regression checks
on:
  push:
    branches: [CPFC]
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/core/db/app_database.g.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fitness_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: fitness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitness_ci -d fitness_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fitness_ci:ci_only@127.0.0.1:5432/fitness_test
      TEST_DATABASE_URL: postgresql+psycopg://fitness_ci:ci_only@127.0.0.1:5432/fitness_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
