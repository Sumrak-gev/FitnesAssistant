name: Quality
on:
  push:
    branches: [main, dev, Drevniy_Jomolungmik]
  pull_request:
permissions:
  contents: read
jobs:
  server-and-client:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fitness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fitness_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/fitness_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/fitness_test
      JWT_SECRET: ci-only-signing-key-which-is-longer-than-forty-eight-characters
      TEST_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: pip install -r server/requirements.txt
      - name: Migrate and verify server
        working-directory: server
        run: |
          alembic upgrade head
          alembic check
          python -m pytest -q
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/fitness-api.log 2>&1 &
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health/db; then exit 0; fi
            sleep 1
          done
          cat /tmp/fitness-api.log
          exit 1
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/core/db/app_database.g.dart
      - run: flutter analyze
      - run: flutter test
      - name: Validate Compose configuration
        run: docker compose --env-file server/.env.example config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=API_URL=http://10.0.2.2:8000
