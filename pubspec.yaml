name: fitness_assistant
description: Мобильное приложение — расчёт КБЖУ и тренировочные программы.
publish_to: 'none'
version: 0.1.0-pre.1+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  flutter_local_notifications: ^22.0.0
  flutter_timezone: ^5.0.0
  timezone: ^0.11.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.10.0
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/
