name: fitness-assistant
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fitness_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FITNESS_OWNER_PASSWORD: ${FITNESS_OWNER_PASSWORD:?Set FITNESS_OWNER_PASSWORD}
      FITNESS_APP_PASSWORD: ${FITNESS_APP_PASSWORD:?Set FITNESS_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./server/deploy/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://fitness_owner:${FITNESS_OWNER_PASSWORD:?Set FITNESS_OWNER_PASSWORD}@db:5432/fitness_dev
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://fitness_app:${FITNESS_APP_PASSWORD:?Set FITNESS_APP_PASSWORD}@db:5432/fitness_dev
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      AUTH_LIMIT: ${AUTH_LIMIT:-20}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-60}
      FORWARDED_ALLOW_IPS: 172.30.40.10
    networks: [default, edge]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    profiles: ["production"]
    networks:
      edge:
        ipv4_address: 172.30.40.10
    volumes:
      - ./server/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  https:
    image: caddy:2-alpine
    profiles: ["production"]
    networks:
      edge:
        ipv4_address: 172.30.40.11
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./server/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    restart: unless-stopped

  backup:
    image: postgres:18-alpine
    profiles: ["production", "backup"]
    environment:
      PGHOST: db
      PGUSER: fitness_app
      PGDATABASE: fitness_dev
      PGPASSWORD: ${FITNESS_APP_PASSWORD:?Set FITNESS_APP_PASSWORD}
    volumes:
      - backups:/backups
      - ./server/deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while /bin/sh /backup.sh; do sleep 86400; done; exit 1"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backups:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.40.0/24
